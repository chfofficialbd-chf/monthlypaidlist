
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHF Member Monthly TK Check Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fb;
    color:#17324d;
}

/* HEADER */

.header{
    height:78px;
    background:#ffffff;
    border-bottom:1px solid #e7eef3;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    position:relative;
    z-index:10;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:15px;
    font-weight:bold;

    background:linear-gradient(
        135deg,
        #087ea4,
        #20b79d
    );

    box-shadow:0 8px 20px
        rgba(8,126,164,.18);
}

.brand-name{
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
}

.brand-sub{
    font-size:11px;
    color:#8294a2;
    margin-top:3px;
}

.header-right{
    font-size:12px;
    color:#638092;
    font-weight:bold;
}


/* HERO */

.hero{
    min-height:calc(100vh - 78px);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:50px 20px;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(32,183,157,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(8,126,164,.12),
            transparent 30%
        ),
        #f4f8fb;
}

.hero-content{
    width:100%;
    max-width:900px;
    text-align:center;

    position:relative;
    z-index:2;
}


/* TOP LABEL */

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 16px;

    border-radius:30px;

    background:white;

    border:1px solid #e1eaf0;

    color:#087ea4;

    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;

    box-shadow:0 8px 25px
        rgba(20,60,80,.06);

    margin-bottom:25px;
}

.badge-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#20b79d;
}


/* TITLE */

.title{
    font-size:clamp(
        40px,
        6vw,
        70px
    );

    line-height:1.05;

    font-weight:900;

    letter-spacing:-2px;

    color:#16354d;

    margin-bottom:20px;
}

.title span{
    background:linear-gradient(
        90deg,
        #087ea4,
        #20a88f
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
