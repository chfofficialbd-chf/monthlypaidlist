<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF MEMBER MONTHLY TK CHECK PORTAL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 14px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      margin: 20px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .organization {
      font-size: 18px;
      font-weight: bold;
      color: #0b654b;
      margin-bottom: 8px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      color: #222;
      line-height: 1.35;
      margin-bottom: 30px;
    }

    .label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #d5dbe0;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #0b654b;
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 8px;
      background: #0b654b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #084d3a;
    }

    .footer {
      margin-top: 22px;
      font-size: 11px;
      color: #999;
    }

    @media (max-width: 500px) {
      .card {
        padding: 35px 25px;
      }

      .title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      class="logo"
      src="https://raw.githubusercontent.com/chfofficialbd-chf/monthlypaidlist/main/Logo%20CHF.jpg"
      alt="CHF Logo"
    >

    <div class="organization">
      Charity Hope Foundation (CHF)
    </div>

    <div class="title">
      CHF MEMBER MONTHLY TK CHECK PORTAL
    </div>

    <label class="label" for="chfId">
      Enter Your CHF ID
    </label>

    <input
      type="text"
      id="chfId"
      placeholder="Example: CHF-49"
      autocomplete="off"
    >

    <button onclick="checkPayment()">
      CHECK PAYMENT
    </button>

    <div class="footer">
      © 2026 Charity Hope Foundation (CHF)
    </div>

  </div>

  <script>
    function checkPayment() {

      const id = document.getElementById("chfId").value.trim();

      if (id === "") {
        alert("Please enter your CHF ID.");
        return;
      }

      alert("CHF ID: " + id);
    }
  </script>

</body>
</html>
