```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Member Monthly TK Check Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef7ff, #f8fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17324d;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 60, 100, 0.12);
      border: 1px solid #e5eef7;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0b78b5, #19a7a0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(11, 120, 181, 0.25);
    }

    .title {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.25;
      color: #123b5d;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: #638096;
      margin-bottom: 32px;
    }

    .welcome {
      font-size: 16px;
      font-weight: 600;
      color: #315a73;
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      color: #34566d;
      margin-bottom: 8px;
    }

    .input-box {
      width: 100%;
      padding: 15px 16px;
      border: 2px solid #dbe8f2;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-box:focus {
      border-color: #1686bd;
      box-shadow: 0 0 0 4px rgba(22, 134, 189, 0.10);
    }

    .check-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #087bb8, #13a49d);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
    }

    .check-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(8, 123, 184, 0.25);
    }

    .info {
      margin-top: 25px;
      padding: 15px;
      background: #f3f9fd;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #668095;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #91a4b3;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 22px;
      }

      .title {
        font-size: 23px;
      }

      .logo {
        width: 78px;
        height: 78px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        CHF
      </div>

      <div class="title">
        CHF MEMBER<br>
        MONTHLY TK CHECK PORTAL
      </div>

      <div class="subtitle">
        Charity Hope Foundation (CHF)
      </div>

      <div class="welcome">
        Check Your Membership Payment
      </div>

      <label class="input-label" for="chfId">
        Enter Your CHF ID
      </label>

      <input
        type="text"
        id="chfId"
        class="input-box"
        placeholder="Example: CHF-49"
        autocomplete="off"
      >

      <button class="check-btn" onclick="checkPayment()">
        CHECK PAYMENT
      </button>

      <div class="info">
        Check your monthly membership payment status,
        payment history & due months.
      </div>

      <div class="footer">
        © Charity Hope Foundation — CHF
      </div>

    </div>

  </div>

  <script>
    function checkPayment() {

      const chfId = document.getElementById("chfId").value.trim();

      if (chfId === "") {
        alert("Please enter your CHF ID.");
        return;
      }

      alert("Payment checking system will be connected here.");
    }
  </script>

</body>
</html>
