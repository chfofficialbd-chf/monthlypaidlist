<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Member Monthly TK Check Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef7ff, #f8fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17324d;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 60, 100, 0.12);
      border: 1px solid #e5eef7;
    }

    /* CHF LOGO */

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(11, 120, 181, 0.18);
      border: 2px solid #e5eef7;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.25;
      color: #123b5d;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: #638096;
      margin-bottom: 32px;
    }

    .welcome {
      font-size: 16px;
      font-weight: 600;
      color: #315a73;
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      color: #34566d;
      margin-bottom: 8px;
    }

    .input-box {
      width: 100%;
      padding: 15px 16px;
      border: 2px solid #dbe8f2;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-box:focus {
      border-color: #1686bd;
      box-shadow: 0 0 0 4px rgba(22, 134, 189, 0.10);
    }

    .check-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #087bb8, #13a49d);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
    }

    .check-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(8, 123, 184, 0.25);
    }

    .info {
      margin-top: 25px;
      padding: 15px;
      background: #f3f9fd;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #668095;
    }

    /* CONTACT AREA */

    .contact {
      margin-top: 20px;
      padding: 12px;
      background: #f8fbfd;
      border: 1px solid #e5eef7;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .qr-link {
      width: 65px;
      height: 65px;
      display: block;
      flex-shrink: 0;

      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #dce8f1;

      transition: 0.2s;
    }

    .qr-link:hover {
      transform: scale(1.05);
    }

    .qr-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-text {
      text-align: left;
    }

    .contact-title {
      font-size: 13px;
      font-weight: 700;
      color: #315a73;
      margin-bottom: 5px;
    }

    .email {
      color: #087bb8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .email:hover {
      text-decoration: underline;
    }

    .facebook {
      margin-top: 4px;
      font-size: 11px;
      color: #91a4b3;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #91a4b3;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 30px 20px;
        border-radius: 20px;
      }

      .title {
        font-size: 23px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 27px;
      }

      .logo {
        width: 85px;
        height: 85px;
        margin-bottom: 17px;
      }

      .welcome {
        font-size: 15px;
      }

      .input-box {
        font-size: 15px;
      }

      .check-btn {
        font-size: 15px;
      }

      .contact {
        gap: 10px;
      }

      .qr-link {
        width: 58px;
        height: 58px;
      }

      .email {
        font-size: 11px;
      }

      .facebook {
        font-size: 9px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- CHF LOGO -->

      <div class="logo">

        <img
          src="https://raw.githubusercontent.com/chfofficialbd-chf/monthlypaidlist/main/Logo%20CHF.jpg"
          alt="CHF Logo"
        >

      </div>


      <!-- TITLE -->

      <div class="title">
        CHF MEMBER<br>
        MONTHLY TK CHECK PORTAL
      </div>


      <div class="subtitle">
        Charity Hope Foundation (CHF)
      </div>


      <div class="welcome">
        Check Your Membership Payment
      </div>


      <!-- CHF ID -->

      <label class="input-label" for="chfId">
        Enter Your CHF ID
      </label>


      <input
        type="text"
        id="chfId"
        class="input-box"
        placeholder="Example: CHF-49"
        autocomplete="off"
      >


      <!-- CHECK BUTTON -->

      <button
        class="check-btn"
        onclick="checkPayment()"
      >
        CHECK PAYMENT
      </button>


      <!-- INFORMATION -->

      <div class="info">
        Check your monthly membership payment status,
        payment history & due months.
      </div>


      <!-- QR + EMAIL -->

      <div class="contact">

        <a
          class="qr-link"
          href="https://www.facebook.com/YOUR-CHF-PAGE"
          target="_blank"
          rel="noopener noreferrer"
        >

          <img
            src="https://raw.githubusercontent.com/chfofficialbd-chf/monthlypaidlist/main/qr%20code.png"
            alt="CHF Facebook QR Code"
          >

        </a>


        <div class="contact-text">

          <div class="contact-title">
            CONTACT CHF
          </div>

          <a
            class="email"
            href="mailto:chfofficialbd@gmail.com"
          >
            chfofficialbd@gmail.com
          </a>

          <div class="facebook">
            Scan QR to visit our Facebook page
          </div>

        </div>

      </div>


      <!-- FOOTER -->

      <div class="footer">
        © Charity Hope Foundation — CHF
      </div>

    </div>

  </div>


  <script>

    async function checkPayment() {

      const chfId =
        document.getElementById("chfId").value.trim();

      if (chfId === "") {

        alert("Please enter your CHF ID.");

        return;
      }

      const apiUrl =
        "https://script.google.com/macros/s/AKfycbwxXusjp382Z9aeuPxuIpLJYGx8FJd0qH_C6eBcdGuGoEa41ISnle1Ucp1SE-voIw3ruA/exec?id="
        + encodeURIComponent(chfId);

      try {

        const response = await fetch(apiUrl);

        const data = await response.json();

        if (!data.success) {

          alert(data.message);

          return;
        }

        alert(
          "CHF ID: " + data.chfId +
          "\nName: " + data.memberName +
          "\nTotal Payments: " + data.totalPayments
        );

      } catch (error) {

        alert(
          "Unable to connect to payment system."
        );

        console.error(error);

      }

    }

  </script>

</body>
</html>
